name: Publish company exhibition

on:
  push:
    branches: [main]
    paths:
      - "kaisha-ni-iku-source-v12.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Extract Astra project
        run: |
          set -eu
          mkdir -p _source _site
          unzip -q kaisha-ni-iku-source-v12.zip -d _source
          test -s _source/kaisha-ni-iku/dist/index.html
          cp -a _source/kaisha-ni-iku/dist/. _site/
          test -s _site/app.js
          test -s _site/vendor/three.module.js
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
