name: Publish company exhibition

on:
  push:
    branches: [main]
    paths:
      - "motto-yoku-miru-company-github-pages-easy.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Extract exhibit package
        run: |
          set -eu
          mkdir -p _site
          unzip -q motto-yoku-miru-company-github-pages-easy.zip -d _site
          test -s _site/index.html
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
